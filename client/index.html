<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Fascinate+Inline&family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Gelasio:ital,wght@0,400..700;1,400..700&family=Libertinus+Serif:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Rubik:ital,wght@0,300..900;1,300..900&family=Saira:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Title & Favicon -->
    <title>PasteBox – Free File Sharing & Storage Platform</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="shortcut icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Description & Keywords for SEO -->
    <meta name="description" content="PasteBox is a secure, fast, and easy-to-use file sharing and storage platform. Upload and share files instantly with a link. No login required. 100% free.">
    <meta name="keywords" content="file sharing, file transfer, upload files, share files online, free file storage, file sharing platform, file upload service, download link, anonymous file sharing">
    <meta name="author" content="PasteBox Team" />

    <!-- Open Graph (Facebook/LinkedIn) -->
    <meta property="og:title" content="PasteBox – Free File Sharing & Storage Platform">
    <meta property="og:description" content="Instantly upload and share files securely. Generate shareable links and download without signup.">
    <meta property="og:image" content="https://pastebox.tech/logo.png" />
    <meta property="og:url" content="https://pastebox.tech" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PasteBox – Free File Sharing Platform" />
    <meta name="twitter:description" content="Secure and fast file sharing without signup. Free and simple." />
    <meta name="twitter:image" content="https://pastebox.tech/logo.png" />

    <!-- Web Manifest (Optional PWA Support) -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1a202c" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://pastebox.tech" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
